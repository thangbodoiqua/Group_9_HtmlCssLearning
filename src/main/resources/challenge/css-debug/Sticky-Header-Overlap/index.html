<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">MyBrand</div>
        <nav>Home | Products | About</nav>
    </header>
    <main class="content">
        <section class="hero">
            <h1>Welcome to My Website</h1>
            <p>Scroll down to see the header issue.</p>
        </section>
        <section class="features">
            <div class="card">Feature 1</div>
            <div class="card">Feature 2</div>
            <div class="card">Feature 3</div>
            <div class="card">Feature 4</div>
            <div class="card">Feature 5</div>
        </section>
        <!-- Content to enable scrolling -->
        <div style="height: 1500px; background: linear-gradient(#fff, #ddd);"></div>
    </main>
</body>
</html>
