<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - Markuply</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/practice.css}">


</head>

<body class="cm-bg" style="margin: 0; display: flex; flex-direction: column; min-height: 100vh;">

    <header th:replace="~{fragment/navbar :: navbar}"></header>

    <div class="practice-toolbar">
        <div class="d-flex align-items-center flex-wrap gap-3" style="gap: 15px;">
            <div class="challenge-dropdown-wrapper">
                <button class="btn btn-outline-light font-weight-bold d-flex align-items-center"
                    onclick="document.getElementById('challengeMenu').classList.toggle('show')">
                    <span class="mr-2" th:text="${challenge?.challengeTitle} ?: 'Select Challenge'"> Select
                        Challenge</span> <small>▼</small>
                </button>
                <div id="challengeMenu" class="challenge-dropdown-menu">
                    <div class="dropdown-group-title"> Pixel Perfect</div>
                    <a th:each="c, iterStat : ${allChallenges}"
                        th:href="@{/practice/pixel-perfect/{title}(title=${c.challengeTitle})}"
                        th:text="${iterStat.count + '. ' + c.challengeTitle}"
                        th:class="'dropdown-item ' + (${c.challengeTitle == challenge.challengeTitle} ? 'active' : '')">
                    </a>
                </div>
            </div>
            <h5 class="mb-0 text-white font-weight-bold d-none d-sm-block"
                th:text="'Pixel Perfect: ' + ${challenge?.challengeTitle}">Pixel Perfect Challenge</h5>
        </div>

        <div class="d-flex align-items-center" style="gap: 15px;">
            <!-- AI Model Selection -->
            <div class="model-selection d-flex align-items-center bg-dark px-3 py-1"
                style="border-radius: 8px; border: 1px solid #334155;">
                <span class="text-muted small mr-2">AI Model:</span>
                <select id="aiModel" class="bg-transparent text-white border-0 small font-weight-bold"
                    style="outline: none; cursor: pointer;">
                    <option value="llama-3.1-8b-instant" style="background: #1e293b;">llama-3.1-8b-instant</option>
                    <option value="gpt-4o" style="background: #1e293b;">GPT-4o</option>
                </select>
            </div>

            <button class="btn btn-cm-primary font-weight-bold px-3 py-2" onclick="updatePreview()"
                style="border-radius: 8px;">
                Run
            </button>
            <button id="btnSubmit" class="btn font-weight-bold shadow-sm" onclick="handleAiSubmit()"
                style="background-color: #10b981; color: white; border-radius: 8px;">
                AI Grade
            </button>
        </div>
    </div>

    <div class="container-fluid px-4 pt-3">
        <div class="alert alert-info practice-requirement mb-0" role="alert">
            <p class="mb-1 font-weight-bold">Practice Goal</p>
            <p class="mb-0 small" th:text="${challenge?.challengeInstructions}"></p>
            <hr class="my-2" style="border-top: 1px solid rgba(0,0,0,.1)">
            <p class="mb-1 font-weight-bold">Hints</p>
            <p class="mb-0 small" th:text="${challenge?.challengeHints}"></p>
        </div>
    </div>

    <div class="practice-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="dark-panel">
            <div class="dark-panel-header">
                <span>1. Code Editor</span>
                <span class="text-danger small">Match the design below</span>
            </div>
            <div id="monaco-editor-container" style="flex: 1; min-height: 0;"></div>
            <textarea id="htmlCode" style="display: none;" th:text="${initialHtml}"></textarea>
            <textarea id="cssCode" style="display: none;" th:text="${initialCss}"></textarea>
        </div>

        <div class="dark-panel">
            <div class="dark-panel-header">
                <span>2. Your Output</span>
            </div>
            <div class="preview-stage">
                <iframe id="practiceFrame" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>

        <div class="dark-panel">
            <div class="dark-panel-header">
                <span>3. Target Reference</span>
            </div>
            <div class="target-stage">
                <iframe id="targetFrame" th:srcdoc="${solutionCombinedHtml}"
                    style="width: 100%; height: 100%; border: none; background: #ffffff;"></iframe>
            </div>
        </div>
    </div>

    <!-- Monaco Editor Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script th:src="@{/js/challenge-evaluator.js}"></script>
    <script th:inline="javascript">
        let editor;
        const rawHtml = document.getElementById('htmlCode').value;
        const rawCss = document.getElementById('cssCode').value;
        const challengeTitle = /*[[${challenge.challengeTitle}]]*/ 'Challenge';

        let initialCombined = '';
        const headIdx = rawHtml.indexOf('</head>');
        if (headIdx !== -1) {
            initialCombined = rawHtml.substring(headIdx) === '' ? rawHtml : rawHtml.substring(0, headIdx) + '<style>\n' + rawCss + '\n</style>\n' + rawHtml.substring(headIdx);
        } else {
            initialCombined = '<style>\n' + rawCss + '\n</style>\n' + rawHtml;
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('monaco-editor-container'), {
                value: initialCombined,
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            updatePreview();
        });

        const frame = document.getElementById('practiceFrame');

        function updatePreview() {
            if (!editor) return;
            const combined = editor.getValue();
            const doc = frame.contentWindow.document;
            doc.open();
            doc.write(combined);
            doc.close();
        }


        async function handleAiSubmit() {
            const modelId = document.getElementById('aiModel').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const originalText = btnSubmit.innerHTML;
            const userCode = editor.getValue();

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Grading...';

            const payload = {
                challengeTitle: challengeTitle,
                userCode: userCode,
                modelId: modelId
            };

            fetch('/practice/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(response => {
                    if (!response.ok) throw new Error('Submission failed');
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        window.location.href = `/practice/result/${data.submissionId}`;
                    } else {
                        alert("Error: " + data.message);
                        resetButton();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("Evaluation failed: " + error.message);
                    resetButton();
                });

            function resetButton() {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        }

        document.addEventListener('click', function (event) {
            const menu = document.getElementById('challengeMenu');
            const wrapperDropdown = document.querySelector('.challenge-dropdown-wrapper');
            if (wrapperDropdown && !wrapperDropdown.contains(event.target)) {
                menu.classList.remove('show');
            }
        });
    </script>

</body>

</html>
