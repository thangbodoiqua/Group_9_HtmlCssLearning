<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enter OTP</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}" />
</head>
<body class="cm-bg d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">

        <div class="card cm-card cm-auth-card">
          <div class="row no-gutters">

            <div class="col-md-5 d-none d-md-flex cm-auth-panel p-5">
              <div>
                <h2 class="cm-heading mb-3">Markuply</h2>
                <h4 class="font-weight-bold">Check your inbox</h4>
                <p class="mt-3 mb-0">
                  We sent a 6-digit verification code to your email.
                  Enter it to confirm your identity.
                </p>
              </div>
            </div>

            <div class="col-md-7 bg-white cm-auth-form p-4">

              <a th:href="@{/auth/forget}" class="cm-back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back
              </a>

              <div class="cm-forgot-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
              </div>

              <h3 class="font-weight-bold mb-2">Check your inbox</h3>
              <p class="cm-text-muted mb-4">
                We sent a 6-digit code to your email address.
                Enter it below to continue.
              </p>

              <form action="/auth/forget/reset" method="post">
                <div class="cm-otp-group">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                  <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>

                <button type="submit"
                        class="auth-btn btn btn-block cm-auth-submit" onclick="window.location.href='/auth/forget/reset'">
                  Verify Code
                </button>
              </form>

              <p class="cm-resend mt-3">
                Didn't receive it?
                <a href="#">Resend code</a>
              </p>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
