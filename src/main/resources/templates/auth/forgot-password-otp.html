<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(~{::title}, ~{::#left-panel}, ~{::#right-panel})}">

<head>
    <title>Enter OTP</title>
</head>

<body>
    <!-- Left panel content -->
    <div id="left-panel">
        <h2 class="cm-heading mb-3">Markuply</h2>
        <h4 class="font-weight-bold">Check your inbox</h4>
        <p class="mt-3 mb-0">
            We sent a 6-digit verification code to your email.
            Enter it to confirm your identity.
        </p>
    </div>

    <!-- Right panel content -->
    <div id="right-panel">
        <a th:href="@{/auth/forget}" class="cm-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </a>

        <div class="cm-forgot-icon">
            <svg viewBox="0 0 24 24">
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
        </div>

        <h3 class="font-weight-bold mb-2">Check your inbox</h3>
        <p class="cm-text-muted mb-4">
            We sent a 6-digit code to your email address.
            Enter it below to continue.
        </p>

        <form th:action="@{/auth/forget/otp}" method="post">
            <input type="hidden" name="email" th:value="${session.resetEmail}">
            <div th:if="${error}" class="alert alert-danger p-2 small" th:text="${error}"></div>
            <div class="cm-otp-group">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" name="otp" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>

            <button type="submit" class="auth-btn btn btn-block mt-3 cm-auth-submit">
                Verify Code
            </button>
        </form>
    </div>
</body>

</html>
