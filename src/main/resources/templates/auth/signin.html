<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>
<body class="cm-bg d-flex align-items-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">

        <div class="card cm-card cm-auth-card">
          <div class="row no-gutters">

            <div class="col-md-5 d-none d-md-flex cm-auth-panel p-5">
              <div>
                <h2 class="cm-heading mb-3">Markuply</h2>
                <h4 class="font-weight-bold">Build faster.<br>Learn smarter.</h4>
                <p class="mt-3 mb-0">
                  Practice HTML & CSS directly in your browser,
                  track progress, and master modern layout techniques.
                </p>
              </div>
            </div>

            <div class="col-md-7 bg-white cm-auth-form p-4">

              <div class="d-flex justify-content-center mb-4 cm-auth-switch">
                <div class="btn-group">
                  <a th:href="@{/auth/signin}" class="btn auth-btn cm-btn-rounded">Sign in</a>
                  <a th:href="@{/auth/signup}" class="btn btn-light cm-btn-rounded">Sign up</a>
                </div>
              </div>

              <h3 class="font-weight-bold mb-2">Welcome back</h3>
              <p class="cm-text-muted mb-4">Sign in to access your learning dashboard</p>

              <form th:action="@{/auth/signin}" method="post">

                  <div th:if="${error}" class="alert alert-danger">
                      <span th:text="${error}"></span>
                  </div>
                <div class="form-group cm-field">
                  <label class="cm-label">Email</label>
                  <input type="email" name="email"
                         class="form-control cm-input"
                         placeholder="name@example.com"
                         th:value="${param.email}"
                         required>
                </div>

                <div class="form-group cm-field">
                  <label class="cm-label">Password</label>
                  <input type="password" name="password"
                         class="form-control cm-input"
                         placeholder="Enter your password"
                         required>
                </div>
                <div>
                  <a th:href="@{/auth/forget}" >Forgot Password?</a>
                <button type="submit"
                        class=" auth-btn btn btn-block mt-4 cm-auth-submit">
                  Sign In
                </button>
                </div>
              </form>
              <div class="text-center mt-4 cm-auth-footer">
                 <span class="cm-text-muted">New here?</span>
                <a th:href="@{/auth/signup}">Create an account</a>
               </div>

             </div>

           </div>
         </div>

       </div>
     </div>
   </div>

</body>
</html>
