<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password reset</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}" />
</head>
<body class="cm-bg d-flex align-items-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">

        <div class="card cm-card cm-auth-card">
          <div class="row no-gutters">

            <div class="col-md-5 d-none d-md-flex cm-auth-panel p-5">
              <div>
                <h2 class="cm-heading mb-3">Markuply</h2>
                <h4 class="font-weight-bold">You're all set!</h4>
                <p class="mt-3 mb-0">
                  Your password has been reset successfully.
                  You can now sign in and continue your learning journey.
                </p>
              </div>
            </div>

            <div class="col-md-7 bg-white cm-auth-form p-4 d-flex align-items-center">

              <div class="w-100 text-center cm-success-content">

                <div class="cm-success-icon">
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>

                <h3 class="font-weight-bold mb-2">Password reset!</h3>
                <p class="cm-text-muted mb-4">
                  Your password has been updated successfully.<br>
                  You can now sign in with your new password.
                </p>

                <a th:href="@{/auth/signin}"
                   class="auth-btn btn btn-block cm-auth-submit">
                  Back to Sign In
                </a>

              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
