<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(~{::title}, ~{::#left-panel}, ~{::#right-panel})}">

<head>
    <title>Password reset</title>
</head>

<body>
    <!-- Left panel content -->
    <div id="left-panel">
        <h2 class="cm-heading mb-3">Markuply</h2>
        <h4 class="font-weight-bold">You're all set!</h4>
        <p class="mt-3 mb-0">
            Your password has been reset successfully.
            You can now sign in and continue your learning journey.
        </p>
    </div>

    <!-- Right panel content -->
    <div id="right-panel">
        <div class="h-100 d-flex align-items-center">
            <div class="w-100 text-center cm-success-content">
                <div class="cm-success-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>

                <h3 class="font-weight-bold mb-2">Password reset!</h3>
                <p class="cm-text-muted mb-4">
                    Your password has been updated successfully.<br>
                    You can now sign in with your new password.
                </p>

                <a th:href="@{/auth/signin}" class="auth-btn btn btn-block cm-auth-submit">
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>

</body>
</html>
