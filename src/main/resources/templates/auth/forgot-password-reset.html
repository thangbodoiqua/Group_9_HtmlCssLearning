<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}" />
</head>
<body class="cm-bg d-flex align-items-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">

        <div class="card cm-card cm-auth-card">
          <div class="row no-gutters">

            <div class="col-md-5 d-none d-md-flex cm-auth-panel p-5">
              <div>
                <h2 class="cm-heading mb-3">Markuply</h2>
                <h4 class="font-weight-bold">Almost there!</h4>
                <p class="mt-3 mb-0">
                  Choose a new strong password to secure your account.
                  Make sure it's something you haven't used before.
                </p>
              </div>
            </div>

            <div class="col-md-7 bg-white cm-auth-form p-4">

              <a th:href="@{/auth/forget/otp}" class="cm-back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back
              </a>

              <div class="cm-forgot-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </div>

              <h3 class="font-weight-bold mb-2">Set new password</h3>
              <p class="cm-text-muted mb-4">
                Choose a strong password that you haven't used before.
              </p>

              <form action="/auth/forget/reset" method="post">
                <div class="form-group cm-field">
                  <label class="cm-label">New Password</label>
                  <input type="password"
                         name="password"
                         class="form-control cm-input"
                         placeholder="At least 8 characters"
                         minlength="8"
                         required>
                </div>

                <div class="form-group cm-field">
                  <label class="cm-label">Confirm</label>
                  <input type="password"
                         name="confirmPassword"
                         class="form-control cm-input"
                         placeholder="Repeat your password"
                         minlength="8"
                         required>
                </div>

                <button type="submit"
                        class="auth-btn btn btn-block mt-2 cm-auth-submit" onclick="window.location.href='/auth/reset-password-success'">
                  Reset Password
                </button>
              </form>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
