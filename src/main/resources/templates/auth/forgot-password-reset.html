<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth/layout :: layout(~{::title}, ~{::#left-panel}, ~{::#right-panel})}">

<head>
    <title>Reset password</title>
</head>

<body>
    <!-- Left panel content -->
    <div id="left-panel">
        <h2 class="cm-heading mb-3">Markuply</h2>
        <h4 class="font-weight-bold">Almost there!</h4>
        <p class="mt-3 mb-0">
            Choose a new strong password to secure your account.
            Make sure it's something you haven't used before.
        </p>
    </div>

    <!-- Right panel content -->
    <div id="right-panel">
        <a th:href="@{/auth/forget/otp}" class="cm-back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </a>

        <div class="cm-forgot-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>

        <h3 class="font-weight-bold mb-2">Set new password</h3>
        <p class="cm-text-muted mb-4">
            Choose a strong password that you haven't used before.
        </p>

        <form action="/auth/forget/reset" method="post">
            <input type="hidden" name="email" th:value="${session.resetEmail}">
            <div th:if="${error}" class="alert alert-danger p-2 small" th:text="${error}"></div>
            <div class="form-group cm-field">
                <label class="cm-label">New Password</label>
                <input type="password" name="newPassword" class="form-control cm-input" placeholder="At least 6 characters"
                    minlength="6" required>
            </div>
            <div class="form-group cm-field">
                <label class="cm-label">Confirm</label>
                <input type="password" name="confirmPassword" class="form-control cm-input"
                    placeholder="Confirm password your password" minlength="6" required>
            </div>

            <button type="submit" class="auth-btn btn btn-block mt-2 cm-auth-submit">
                Reset Password
            </button>
        </form>
    </div>
</body>

</html>
