<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="comparePage(pageTitle, pageDescription, selectedPropertyName,optionsFragment, previewFragment)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Compare CSS'">Compare CSS</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/compare.css}">
    <script th:src="@{/js/compare-utils.js}" defer></script>
</head>
<body class="cm-bg m-0 d-flex flex-column min-vh-100">
<header th:replace="~{fragment/navbar :: navbar}"></header>
<main class="container py-4">
    <section class="lesson-card p-4">

        <!-- ── Header ─────────────────────────────────────────── -->
        <div class="compare-header mb-4">
            <div>
                <h1 class="cm-heading mb-2" th:text="${pageTitle}">CSS Property</h1>
                <p class="text-muted small mb-0" th:text="${pageDescription}">Property description</p>
            </div>
            <div class="compare-header-select-wrap">
                <label class="compare-section-label mb-2 d-block">CSS Property</label>
                <!-- Custom Dropdown Selector -->
                <div class="custom-select-wrapper" id="propertySelectWrapper">
                    <div class="custom-select-trigger" id="propertySelectTrigger">
                        <span th:text="${selectedPropertyName}">Select Property</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="custom-select-options" id="propertySelectOptions">
                        <div th:each="name : ${allPropertyNames}"
                             class="custom-select-option"
                             th:classappend="${name == selectedPropertyName} ? 'selected' : ''"
                             th:data-value="${name}">
                             <span th:text="${name}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Interactive Playground ─────────────────────────── -->
        <div class="interactive-playground">

            <!-- Options Panel (Left) ─────────────────────────── -->
            <div class="compare-options-panel">
                <div class="compare-section-label mb-2">Available Options</div>
                <div class="compare-options-list">
                    <!-- Child template will replace this block -->
                    <th:block th:replace="${optionsFragment}"></th:block>
                </div>
            </div>

            <!-- Preview Panel (Right) ─────────────────────────── -->
            <div class="compare-preview-panel">
                <div class="compare-section-label mb-2">Live Preview</div>
                <div class="compare-preview-wrap">
                    <!-- Child template will replace this block -->
                    <th:block th:replace="${previewFragment}"></th:block>
                </div>
            </div>

        </div><!-- /.interactive-playground -->
    </section>
</main>

<script>
    (function () {
        var wrapper = document.getElementById('propertySelectWrapper');
        var trigger = document.getElementById('propertySelectTrigger');
        var options = document.getElementById('propertySelectOptions');

        if (trigger && options) {
            // Toggle dropdown dropdown
            trigger.addEventListener('click', function(e) {
                wrapper.classList.toggle('open');
                e.stopPropagation();
            });

            // Handle option selection
            var optionElements = options.querySelectorAll('.custom-select-option');
            optionElements.forEach(function(opt) {
                opt.addEventListener('click', function(e) {
                    var val = this.getAttribute('data-value');
                    if (val) window.location.href = '/compare-css/' + encodeURIComponent(val);
                });
            });

            // Close dropdown if clicked outside
            document.addEventListener('click', function(e) {
                if (wrapper && !wrapper.contains(e.target)) {
                    wrapper.classList.remove('open');
                }
            });
        }
    })();
</script>
</body>
</html>
