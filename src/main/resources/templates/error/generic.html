<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error | Markuply</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
  <link rel="stylesheet" th:href="@{/css/error.css}" />
</head>
<body class="cm-bg d-flex flex-column">

<header th:replace="~{fragment/navbar :: navbar}"></header>

<main class="error-page flex-grow-1">
  <div class="error-card">
    <div class="error-code" th:text="${statusCode}">Error</div>
    <h1 class="h3 error-title" th:text="${errorTitle}">Something went wrong</h1>
    <p class="error-message" th:text="${errorMessage}">
      An unexpected error occurred.
    </p>
    <a th:href="@{/}" class="error-back-btn">← Back to Home</a>
  </div>
</main>

</body>
</html>
