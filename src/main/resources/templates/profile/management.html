<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="cm-bg m-0 d-flex flex-column min-vh-100">
<main class="container py-4">
    <section class="lesson-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="cm-heading mb-0">Profile Management</h1>
            <span class="badge text-bg-secondary" th:text="${profile.userRole}">STUDENT</span>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label text-muted small">User ID</label>
                <input type="text" class="form-control" th:value="${profile.id}" readonly>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small">Full Name</label>
                <input type="text" class="form-control" th:value="${profile.userName}" readonly>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small">Email</label>
                <input type="email" class="form-control" th:value="${profile.email}" readonly>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small">Date of Birth</label>
                <input type="text" class="form-control" th:value="${profile.dob}" readonly>
            </div>
        </div>

        <p class="text-muted small mt-4 mb-0">
            This page currently uses mock profile data from service layer until login/auth flow is completed.
        </p>
    </section>
</main>
</body>
</html>
