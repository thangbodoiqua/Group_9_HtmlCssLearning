<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="lesson-actions" class="mt-5 pt-4 border-top d-flex justify-content-between align-items-center flex-wrap lesson-actions">

    <a class="btn btn-lesson-nav" th:href="${prevLessonUrl}" th:if="${prevLessonUrl != '#'}"
       aria-label="Previous lesson">← Previous</a>
    <span th:if="${prevLessonUrl == '#'}"></span>

    <button id="btnMarkCompleted"
            th:class="${isCompleted} ? 'btn btn-success px-4 py-2 shadow-sm' : 'btn btn-cm-primary px-4 py-2 shadow-sm'" 
            type="button"
            th:data-lesson-id="${currentLessonId}"
            th:data-user-id="${userId}"
            th:disabled="${isCompleted}"
            th:style="${isCompleted} ? 'pointer-events: none;' : ''">
        <span th:text="${isCompleted} ? '✔ Completed' : 'Mark as Completed'">Mark as Completed</span>
    </button>

    <a class="btn btn-lesson-nav" th:href="${nextLessonUrl}" th:if="${nextLessonUrl != '#'}"
       aria-label="Next lesson">Next →</a>
    <span th:if="${nextLessonUrl == '#'}"></span>

    <script th:src="@{/js/lesson-actions.js}"></script>
</div>

</body>
</html>
