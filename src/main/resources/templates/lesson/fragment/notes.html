<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <div th:fragment="notes">
    <button class="lesson-note-fab" type="button" id="openNoteFab" aria-label="Open notes" title="Notes">
      <span>📝</span>
    </button>

    <div class="lesson-note-modal" id="noteModal" role="dialog" aria-modal="true"
         th:data-lesson-id="${currentLessonId}" th:data-user-id="${userId}">
      <div class="lesson-note-dialog">
        <div class="lesson-note-dialog-header">
          <h6 class="lesson-note-dialog-title">My Notes</h6>
          <button class="btn btn-sm btn-light border font-weight-bold" type="button" id="closeNoteBtn">Close</button>
        </div>
        <div class="lesson-note-dialog-body">
          <!-- Saved Note Preview -->
          <div id="currentNoteDisplay" class="mb-3 p-3 border rounded bg-light d-none">
            <div class="small text-muted font-weight-bold mb-2">Saved Note:</div>
            <div id="noteContent" class="small text-dark" style="white-space: pre-wrap;"></div>
          </div>

          <!-- Input Field -->
          <div class="form-group mb-0">
            <label for="noteTextarea" class="small font-weight-bold text-muted">Write/Edit Note:</label>
            <textarea class="note-textarea" id="noteTextarea" placeholder="Click here to start writing..."></textarea>
          </div>
        </div>
        <div class="lesson-note-dialog-footer">
          <button class="btn btn-sm btn-light border font-weight-bold" type="button" id="dismissNoteBtn">
            Cancel
          </button>
          <button class="btn btn-sm btn-cm-primary font-weight-bold px-4" type="button" id="saveNoteBtn">
            Save Note
          </button>
        </div>
      </div>
    </div>
    <script th:src="@{/js/lesson-notes.js}"></script>
  </div>
  <div th:replace="~{lesson/fragment/notes :: notes}"></div>
</body>

</html>
