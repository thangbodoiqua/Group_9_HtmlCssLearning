<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="main_layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Markuply</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/lesson.css}">
</head>
<body class="cm-bg cm-page-shell">

<header th:replace="~{lesson/fragment/navbar :: navbar}"></header>

<div class="lesson-layout">
    <aside th:replace="~{lesson/fragment/sidebar :: sidebar}"></aside>

    <main class="lesson-main-content">
        <div class="lesson-card">

            <div th:replace="${content}"></div>

        </div>
    </main>
</div>

<button class="lesson-note-fab" type="button" id="openNoteFab" aria-label="Open notes" title="Notes">
    <span>📝</span>
</button>

<div class="lesson-note-modal" id="noteModal" role="dialog" aria-modal="true">
    <div class="lesson-note-dialog">
        <div class="lesson-note-dialog-header">
            <h6 class="lesson-note-dialog-title" th:text="'My Notes: ' + ${#strings.replace(currentLessonName, '_', ' ')}">My Notes</h6>
            <button class="btn btn-sm btn-light border font-weight-bold" type="button" id="closeNoteBtn">Close</button>
        </div>
        <div class="lesson-note-dialog-body">
            <textarea class="note-textarea" id="noteTextarea" placeholder="Save your notes..."></textarea>
        </div>
        <div class="lesson-note-dialog-footer">
            <button class="btn btn-sm btn-cm-primary font-weight-bold px-3" type="button" id="saveNoteBtn">Save Note</button>
        </div>
    </div>
</div>

<script>
    function linkToCompilerWithCode(linkEl, { lang, code }) {
      if (!linkEl) return;
      const url = `/compiler?lang=${encodeURIComponent(lang)}&code=${encodeURIComponent(code)}`;
      linkEl.setAttribute("href", url);
    }
    // Khởi tạo Note Modal
    function openNoteModal() { document.getElementById("noteModal").classList.add("show"); }
    function closeNoteModal() { document.getElementById("noteModal").classList.remove("show"); }
    document.getElementById("openNoteFab")?.addEventListener("click", openNoteModal);
    document.getElementById("closeNoteBtn")?.addEventListener("click", closeNoteModal);
</script>
</body>
</html>
