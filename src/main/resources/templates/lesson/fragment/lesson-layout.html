<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="main_layout(title, content)">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Markuply</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/lesson.css}">
</head>

<body class="cm-bg cm-page-shell">

    <header th:replace="~{fragment/navbar :: navbar}"></header>

    <div class="lesson-layout">
        <aside th:replace="~{lesson/fragment/sidebar :: sidebar}"></aside>

        <main class="lesson-main-content">
            <div class="lesson-card">

                <div th:replace="${content}"></div>

                <div id="persistentNoteContainer" class="note-wrapper border-top mt-4 d-none"
                    th:classappend="${!#strings.isEmpty(currentNote)} ? 'show d-block' : ''">
                    <div class="small text-muted font-weight-bold mb-1">
                        <span class="mr-2">📝</span> My Current Note:
                    </div>
                    <div id="persistentNoteContent" class="small text-dark" style="white-space: pre-wrap;"
                        th:text="${currentNote}"></div>
                </div>

            </div>
        </main>
    </div>

    <script th:src="@{/js/compiler-logic.js}"></script>
    <script>
        function linkToCompilerWithCode(linkEl, { lang, code }) {
            if (!linkEl) return;
            const url = `/compiler?lang=${encodeURIComponent(lang)}&code=${encodeURIComponent(code)}`;
            linkEl.setAttribute("href", url);
        }
    </script>
    <div th:replace="~{lesson/fragment/notes :: notes}"></div>
</body>

</html>
