<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Compiler - Markuply</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/compiler.css}">
</head>

<body class="cm-bg" style="margin: 0; display: flex; flex-direction: column; min-height: 100vh;">

    <header th:replace="~{lesson/fragment/navbar :: navbar}"></header>
    <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">

    <main class="compiler-wrapper">
        <div class="compiler-header">
            <div>
                <h2 class="cm-heading mb-1">Live Code Compiler</h2>
                <p class="mb-0">Write HTML and CSS together. Press "Run Code" to update the preview.</p>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button class="btn text-white font-weight-bold px-4 py-2 me-2" onclick="saveCode()"
                    style="background-color: #10b981; border: none; border-radius: var(--cm-radius-sm); box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);">
                    Save Code
                </button>

                <button class="btn text-white font-weight-bold mx-2 px-4 py-2 me-2" onclick="formatCode()"
                    style="background-color: #6366f1; border: none; border-radius: var(--cm-radius-sm); box-shadow: 0 4px 6px rgba(99, 102, 241, 0.2);">
                    Format Code
                </button>

                <button class="btn btn-cm-primary font-weight-bold px-4 py-2" onclick="runCode()"
                    style="border-radius: var(--cm-radius-sm);">
                    Run Code
                </button>
            </div>
        </div>

        <div class="compiler-grid">
            <div class="compiler-panel" style="min-height: 500px;">
                <div class="panel-header">
                    <span style="color: #e34c26; font-size: 1.1rem; margin-right: 8px;">&lt;/&gt;</span> index.html
                </div>
                <div id="editorContainer" style="flex: 1; width: 100%;"></div>
                <div id="initialCode" style="display: none;" th:text="${code ?: defaultCode}"></div>
            </div>

            <div class="compiler-panel">
                <div class="panel-header">
                    <span></span> Output Preview
                </div>
                <div class="preview-area">
                    <iframe id="previewFrame" class="preview-iframe"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script th:src="@{/js/compiler-logic.js}"></script>

</body>

</html>
