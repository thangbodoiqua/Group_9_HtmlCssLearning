<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <header th:fragment="navbar" class="cm-navbar-container d-flex justify-content-between align-items-center">
    <a th:href="@{/}" class="text-decoration-none">
      <h3 class="cm-brand mb-0" style="font-size: 1.5rem">Markuply</h3>
    </a>

    <button class="btn d-lg-none" onclick="document.querySelector('.cm-nav-links').classList.toggle('show')"
      style="font-size: 1.5rem; padding: 0; color: var(--cm-text-main)">
      ☰
    </button>

    <nav class="cm-nav-links">
      <a th:href="@{/lesson/html}" class="cm-nav-link"
         th:classappend="${currentCategory == 'HTML'} ? 'active' : ''">HTML Learning</a>
      <a th:href="@{/lesson/css}" class="cm-nav-link" th:classappend="${currentCategory == 'CSS'} ? 'active' : ''">CSS
        Learning</a>
      <a th:href="@{/compiler}" class="cm-nav-link">Code Compiler</a>
      <div class="cm-nav-dropdown">
        <a th:href="@{/practice/pixel-perfect}" class="cm-nav-link">Practice <small class="cm-nav-caret">▼</small></a>
        <div class="cm-nav-dropdown-menu">
          <a th:href="@{/practice/pixel-perfect}">Pixel Perfect mode</a>
          <a th:href="@{/practice/css-debug}">CSS Debug mode</a>
        </div>
      </div>
      <a th:href="@{/compare-css}" class="cm-nav-link"
         th:classappend="${currentCategory == 'COMPARE'} ? 'active' : ''">Compare CSS</a>

      <div class="border-top my-2 d-lg-none"></div>
      <a sec:authorize="!isAuthenticated()" th:href="@{/auth/signin}" class="cm-nav-link d-lg-none text-primary font-weight-bold">Sign In</a>
      <div sec:authorize="isAuthenticated()" class="d-lg-none">
        <div class="px-3 py-2 d-flex align-items-center">
          <img th:src="@{'https://ui-avatars.com/api/?name=' + ${#authentication.principal.userName} + '&background=2563eb&color=fff'}" alt="Avatar" class="rounded-circle mr-2" width="30" />
          <span class="font-weight-bold" style="color: var(--cm-text-main)" th:text="${#authentication.principal.userName}"></span>
        </div>
        <a th:href="@{/profile}" class="cm-nav-link pl-4">Profile</a>
        <a th:href="@{/progress}" class="cm-nav-link pl-4">View Progress</a>
        <a th:href="@{/auth/logout}" class="cm-nav-link pl-4 text-danger">Logout</a>
      </div>
    </nav>

    <div class="user-actions d-none d-lg-block">
      <a sec:authorize="!isAuthenticated()" th:href="@{/auth/signin}" class="btn btn-primary" style="background-color: var(--cm-bg-button); color: white;">Sign in</a>
      <div sec:authorize="isAuthenticated()" class="profile-dropdown">
        <div class="d-flex align-items-center">
          <img th:src="@{'https://ui-avatars.com/api/?name=' + ${#authentication.principal.userName} + '&background=2563eb&color=fff'}" alt="Avatar"
            class="rounded-circle mr-2" width="35" />
          <span class="font-weight-bold" style="color: var(--cm-text-main)"><span th:text="${#authentication.principal.userName}"></span> <small>▼</small></span>
        </div>
        <div class="dropdown-menu-custom">
          <a th:href="@{/profile}"> Profile</a>
          <a th:href="@{/progress}"> View Progress</a>
          <div class="border-top my-1"></div>
          <a th:href="@{/auth/logout}" class="text-danger"> Logout</a>
        </div>
      </div>
    </div>

    <script th:inline="javascript">
      window.markuplyConfig = {
        currentCategory: /*[[${currentCategory}]]*/ 'HTML',
        compilerUrl: /*[[@{/compiler}]]*/ '/compiler'
      };
    </script>
    <script th:src="@{/js/lesson-tryexample.js}"></script>
    <script th:src="@{/js/lesson-preview.js}"></script>
  </header>
<div th:replace="~{lesson/fragment/notes :: notes}"></div>
</body>

</html>
